name: Image scan

# Wöchentlicher Trivy-Scan des veröffentlichten Images (Tag "latest"). Die CI scannt ein Image
# nur beim Bau; eine später bekannt gewordene Lücke in einem veröffentlichten Image bliebe sonst
# bis zum nächsten Pull Request unbemerkt. Ein kritischer Fund mit verfügbarem Fix lässt den
# Lauf fehlschlagen, das löst eine Benachrichtigung aus.
# Kritische und hohe Funde erscheinen außerdem unter Security -> Code scanning und schließen
# sich dort selbst, sobald ein neues Release sie behebt.
# Ein Pull Request, der diese Datei ändert, führt den Scan einmal zur Probe aus.

on:
  schedule:
    - cron: "23 5 * * 2" # dienstags, nach dem Dependabot-Lauf am Montag
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/image-scan.yml

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Veröffentlichtes Image holen
        id: image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # Übersicht kritischer und hoher Funde, für die es einen Fix gibt …
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # Kritische und hohe Funde für Security -> Code scanning (nicht bei Probeläufen in Pull
      # Requests: deren Token darf keine Security-Events schreiben)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
          category: image-scan
      # … nur kritische lassen den Lauf fehlschlagen
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
