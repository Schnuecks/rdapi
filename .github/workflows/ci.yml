name: CI

# Pull Requests und Versions-Tags durchlaufen alles: Linter (Ruff), Python-Tests, Image-Bau
# für alle Plattformen und Trivy-Scan auf bekannte Sicherheitslücken. Ein Push auf main ist
# fast immer der Squash eines eben geprüften PRs: dort laufen nur Linter und Tests als
# Sicherheitsnetz, der Image-Bau wäre doppelt.
# Bei Pull Requests wird das Image nur probeweise gebaut (nicht hochgeladen), damit Speicher
# und Datenvolumen geschont werden und ein Fehler auf einer Plattform vor dem Release auffällt.
# Hochgeladen wird es nur bei einem Versions-Tag (v1.2.3); danach bleiben die
# letzten fünf Releases erhalten (KEEP_VERSIONS), ältere werden gelöscht.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORMS: linux/amd64,linux/arm64   # PC/Server, Raspberry Pi 4/5 und NAS
  # Paketversionen, die beim Aufräumen bleiben: pro Release 1 Index + 1 Image je Plattform
  # (2 Plattformen = 3 Versionen), also 5 Releases = 15.
  KEEP_VERSIONS: 15

jobs:
  changes:
    # Only docs changed (Markdown, docs/, licence, issue templates)? Then tests, browser test and
    # image are skipped; GitHub counts skipped required checks as passed. Tags always run everything.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04  # fest, damit ein Wechsel von ubuntu-latest nichts unerwartet ändert
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m pytest -q

  image:
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: contains(env.PLATFORMS, 'arm')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: release
        run: echo "push=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.push }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false   # keine zusätzlichen Manifeste, spart Speicher
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sicherheitsscan: das amd64-Image aus dem Cache laden (die arm64-Pakete sind dieselben)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rdapi:scan
          provenance: false
          sbom: false
          cache-from: type=gha
      # Übersicht über kritische und hohe Lücken, für die es eine Korrektur gibt …
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rdapi:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # … abgebrochen wird nur bei kritischen; „hoch“ im Basis-Image soll kein Release blockieren,
      # bis Debian nachgezogen hat (Dependabot schlägt das neue Basis-Image dann vor)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rdapi:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  dependabot-merge:
    # Übernimmt Dependabot-Vorschläge für Patch- und Minor-Updates selbst, sobald alle
    # Prüfungen oben grün sind. Major-Updates bleiben offen und werden von Hand geprüft.
    needs: [test, image]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Patch- und Minor-Updates übernehmen
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  cleanup:
    # Nach einem Release ältere Image-Versionen entfernen
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
