[project]
name = "rdapi"
version = "0.1.0"
description = "Schlanker eigener API-Server für die RustDesk-App"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI-Depends in Default-Argumenten ist so gewollt
